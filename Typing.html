            "Technology has changed our daily life. It makes work faster. It saves time. It connects people through messages and video calls. Students learn better with digital tools. Online classes help students study from any place. Doctors use modern machines for treatment. Farmers use smart systems to protect crops. Technology supports business growth. It helps companies reach customers worldwide. It creates new jobs in software and digital services. Safety systems reduce risks in factories. Homes use security devices for protection. But technology also needs careful use. Too much screen time harms the eyes. Social media may create stress. Children need guidance to use devices carefully. Cybercrime is increasing every year. People must protect personal information online. Schools should teach digital safety rules. Families should plan limited screen hours. Outdoor activities keep the mind fresh. Technology is a powerful tool. It should improve life, not control life. Smart use of technology brings comfort and progress. It helps solve big problems in health, education, and environment. It supports research and innovation. It connects different cultures. It spreads knowledge faster than before. Technology will keep growing. People must learn to use it wisely and responsibly. A balanced digital life creates a safer and happier future for all.",
            "Food security ensures that every person has access to safe, nutritious, and affordable food for an active and healthy life. It is important for health, growth, and national stability. Farmers, food suppliers, and governments work together to maintain food availability and satisfy the needs of the population. Climate change, droughts, floods, pests, and soil degradation are major challenges affecting food production. Modern farming techniques such as drip irrigation, organic fertilizers, and improved seeds can increase crop yield and protect resources. Storage facilities must be improved to prevent wastage of grains, vegetables, and fruits. Fair market prices help farmers maintain income and support their families without financial stress. Food security also requires awareness about nutrition. People should eat balanced meals that include grains, vegetables, fruits, proteins, and healthy fats to avoid deficiency. Schools can provide nutrition programs to reduce malnutrition in children and encourage healthy eating habits. Reducing food waste at homes, restaurants, and supermarkets is equally important. Food banks and community kitchens can support families during difficult times. International cooperation is needed to share research, seeds, and farming technology to improve global production. Food security is not just about producing enough food; it is about distributing it fairly and ensuring that no one goes hungry. A well-fed society is healthier, more productive, and better prepared for the future.",
            "Transportation plays a vital role in connecting people, goods, and services across different regions. Roads, railways, airways, and waterways support trade, tourism, and employment, making daily life more convenient. Public transport systems such as buses, trains, and metros reduce traffic and pollution. They allow students, workers, and travelers to reach destinations safely and affordably without stress. Modern technology has improved navigation through GPS, automated toll systems, and smart traffic management that help reduce delays. Electric vehicles are becoming popular because they reduce air pollution and save fuel, creating a cleaner environment. However, transportation challenges include road accidents, traffic congestion, and rising fuel costs that create difficulties for citizens. Governments must invest in safer roads, proper traffic signals, and emergency services to protect lives. Awareness campaigns can educate citizens about speed limits, helmet use, and seat belt safety. Transport also affects the environment. Emissions from vehicles contribute to climate change and health problems such as asthma. Promoting bicycles and walking for short distances can improve fitness and reduce pollution at the same time. Shipping and aviation industries are researching cleaner fuels to protect the planet. Transportation networks must be accessible for people with disabilities and senior citizens. When transportation is safe, efficient, modern, and eco-friendly, it becomes a strong foundation for progress and better quality of life.",
            "Leadership is the ability to guide, motivate, and support others to achieve a shared goal. A good leader listens carefully, communicates clearly, and takes decisions responsibly. Leaders can be found in classrooms, workplaces, communities, and governments, shaping the future through their actions and attitudes. True leadership is not about power or control, but about service and integrity that inspire trust. A leader encourages teamwork, values different opinions, and helps people develop confidence by recognizing their strengths. Students can practice leadership by organizing events, helping classmates, and participating in group projects that build discipline and cooperation. In businesses, leaders inspire employees to improve their skills and work with dedication toward common objectives. In society, leaders create awareness about important issues and support the welfare of people by promoting fair and ethical practices. Honesty and transparency are essential qualities because trust is the foundation of leadership. A leader must remain calm during challenges and learn from mistakes to become stronger. Leadership also requires empathy, which means understanding the feelings of others and offering support when needed. When leaders empower people, they create more leaders instead of followers. History is full of individuals who changed the world through courage and vision. Anyone who brings positive change and encourages growth is a leader. Leadership begins with responsibility, and it becomes successful with compassion.",
            "Rural development is essential for balanced national progress. Villages are the backbone of agriculture, dairy farming, and natural resource management. Many farmers work tirelessly to grow crops that supply food to cities and support the nation's economy. However, some rural areas lack good roads, schools, hospitals, and job opportunities, which limits community growth. Rural development programs aim to improve these conditions by providing better infrastructure, clean water, electricity, and digital services that connect villages to larger markets. Education is a powerful tool that can transform rural communities and open new possibilities for children. Skilled teachers and modern learning resources help children build knowledge and confidence for future careers. Healthcare services should provide vaccinations, maternity care, and awareness about hygiene to reduce diseases. Employment training in fields such as farming technology, carpentry, tailoring, and small businesses can create income sources and encourage self-reliance. Women's self-help groups support financial independence and encourage entrepreneurship through savings and cooperation. Young people can contribute by learning new techniques that improve farming and reduce waste. Technology, if used effectively, can connect farmers to markets where they receive fair prices for their products. Eco-friendly farming protects soil and reduces water pollution. Villages rich in culture and tradition also have great tourism potential. When rural and urban areas grow together, the entire nation becomes stronger and more self-reliant.",
            "Art and culture are the heart of human identity. They reflect traditions, beliefs, and histories that shape societies. Art includes music, dance, painting, literature, and architecture, each expressing emotions and creativity in unique ways. Culture teaches values such as respect, kindness, and community bonding. Festivals bring people together and strengthen relationships by creating joyful memories. Traditional songs and folk stories preserve wisdom passed down from ancestors and help young generations understand their roots. Museums and cultural centers protect historical objects so future generations can understand their heritage and appreciate their uniqueness. In the modern world, cultures blend through travel, media, and communication. People learn new languages, enjoy different foods, and appreciate diverse customs that enrich global harmony. Artists use their skills to inspire social change, raise awareness, and support unity through meaningful expression. Art therapy helps people manage stress and express feelings without fear. Schools should promote art education to enhance imagination and creative thinking among students. Communities can protect culture by supporting local artists, organizing festivals, and preserving ancient monuments. Cultural diversity makes the world more colorful and interesting. Respecting cultures does not mean rejecting progress; instead, it helps society move forward with strong identity and gratitude. When people value art and culture, they create a peaceful world where traditions and innovations coexist with harmony.",
            "Rudra played the flute better than anyone in his village. People said the forest birds paused to listen whenever he practiced near the river. The forest was alive with music: parrots chattered like excited children, peacocks drummed their feathers, and streams hummed gentle tunes. But over the years, trees were cut for roads and markets. Animals vanished one by one, and the air felt heavier, as if the forest itself had forgotten how to breathe. Rudra tried playing the flute again, hoping music might heal the land. But the melodies felt lonely, incomplete. One evening, an old herbalist told him, \"The forest listens, but it needs help, not just music.\" Rudra gathered students from his school and began planting saplings along the riverbank. They named each tree after a musical instrument: sitar, tabla, flute, veena. Seasons passed. Leaves returned, birds returned, and slowly the music returned. One morning, a rare songbird perched on a branch and whistled a tune that matched Rudra's melody. Villagers gathered, amazed at the harmony between flute and forest. Rudra realized that music and nature were never separate; one protected the other.",
            "Disaster management is an important process that prepares communities to face natural and man-made emergencies. Floods, earthquakes, cyclones, and forest fires can cause loss of lives and property. Industrial accidents, chemical leaks, and transportation failures are also dangerous. Effective disaster management involves planning, early warning systems, quick rescue support, and proper rehabilitation of affected people. Governments must invest in strong infrastructure, emergency response teams, and medical services. Schools should include disaster awareness programs so students know how to stay safe during emergencies. Communities can participate in training sessions that teach first-aid, emergency communication, and evacuation routes. Technology plays a significant role in predicting weather patterns and informing citizens through mobile alerts and media. International organizations also help countries facing severe disasters by sending medical supplies, food, and rescue teams. After a disaster, rebuilding homes, schools, and workplaces requires patience, resources, and cooperation. People should support one another and remain emotionally strong during recovery. Environmental protection can prevent some disasters by reducing deforestation and pollution. Disaster management is not only about reacting to events, but also preparing to minimize damage before it happens. When nations work together, share knowledge, and help those in need, the world becomes safer and more resilient.",
            "Honesty is a virtue that strengthens character and builds trust among people. An honest person speaks the truth and behaves with fairness, even when it is difficult. Honesty creates strong relationships in families, friendships, schools, and workplaces. When people trust one another, they work together more effectively and solve problems peacefully. Dishonesty may provide short-term benefits, but it eventually leads to regret, guilt, and broken trust. Students must learn honesty at an early age, especially in studies and examinations. Cheating might help them pass a test, but it prevents real learning and weakens their future. In business, honesty is the foundation of good reputation. Customers support companies that provide quality products and transparent services. Employees respect leaders who are truthful and responsible. Honesty also matters in personal decisions. People should be true to themselves, recognize their strengths, and improve their weaknesses. Being honest does not mean being rude. Truth should be expressed with kindness and respect for others' feelings. Society becomes safer and more peaceful when citizens follow rules and speak truthfully. Honesty encourages fairness in law, politics, and public service. It protects human dignity and promotes justice. When individuals practice honesty, they inspire others and contribute to a world filled with trust, respect, and harmony.",
            "Environment plays a crucial role in sustaining life on Earth. Clean air, pure water, and healthy soil are essential for human survival. Unfortunately, rapid industrialization and careless human activities have damaged the environment. Air pollution from vehicles and factories is causing breathing problems in cities. Water pollution from chemicals and plastics is affecting rivers and oceans, harming marine life and spreading diseases. Deforestation has destroyed forests that once provided fresh oxygen and protected biodiversity. Climate change is now causing storms, droughts, and unpredictable seasons, affecting agriculture and food security. People need to understand that protecting the environment is not the responsibility of governments alone. Every person must take small but meaningful steps. Saving electricity, reducing plastic usage, planting trees, and recycling waste can create significant improvements. Students should be educated about environmental conservation so they develop respect for nature from a young age. Farmers can use eco-friendly techniques that protect soil and water. Companies should adopt responsible production methods to reduce carbon emissions. Green energy sources like wind, solar, and hydropower are sustainable and help reduce pollution. Nature is a priceless gift, and once it is destroyed, it cannot be easily restored. Protecting the environment ensures a healthy future for upcoming generations. Human progress is important, but it must never come at the cost of nature.",
            "Kabir had always been fascinated by flight. As a child, he watched birds glide across the morning sky and dreamed of joining them. His family could not afford expensive toys, so he used paper from old notebooks to create wings of different shapes. Some looked like eagle feathers, others like butterfly wings painted with bright colors. People laughed and said, \"Paper cannot take you anywhere.\" Kabir only smiled and kept experimenting. Years passed, and Kabir studied aerodynamics in college. He discovered that his childhood paper models were not just toys; they followed real patterns of lift and balance. He dedicated his research to designing lightweight wings for rescue drones that could reach disaster zones where helicopters could not land. His prototypes were inspired by the very paper shapes he once tested in his courtyard. Kabir presented his invention at an international science exhibition. Judges were amazed that his idea originated from simple paper wings. Soon, emergency teams used his lightweight drones to deliver medicine, food, and water to people trapped after floods and earthquakes. Kabir visited his old home and saw children still playing with paper. He taught them that ideas may begin small, but with patience they can soar across the world.",
            "In a small village, school did not begin with a bell or a timetable. It began under the shade of a giant banyan tree. The tree had stood there for generations, its branches stretching like protective arms over children who gathered with notebooks and hopeful hearts. Their teacher, Ms. Raina, believed that learning was not just about memorizing lessons but exploring the world with curiosity. Some students sat on mats, others on smooth stones, and a few climbed the lower branches to enjoy the cool breeze while reading poetry. Ms. Raina used leaves to teach shapes, soil to explain history, and raindrops to describe the water cycle. Whenever a new bird built a nest, the whole class observed and wrote stories about it. Even parents joined sometimes, sharing folk tales and traditional skills that had been passed down for centuries. One day, government officers visited the village and promised to build a concrete school building. The children were excited, yet they asked if the banyan tree could remain their classroom too. Officials agreed, realizing the tree was not merely a place but a spirit of learning. Years later, former students returned as doctors, farmers, engineers, and artists. They sat beneath the same banyan tree and agreed that knowledge grows best when it has roots in nature, kindness, and imagination.",
            "Blue Harbor was a fishing town where nights were darker than anywhere else. There were no streetlights along the shore, and fishermen struggled to guide boats safely. In a small workshop near the lighthouse lived a lantern maker named Yusuf. He crafted lanterns from recycled glass bottles, seashells, and driftwood washed onto the sand. Every lantern was unique, each telling a different story through its colored glass. One stormy evening, the lighthouse lamp broke, and fishermen preparing to return feared they would never reach the shore. Waves roared like wild animals, and families waited helplessly. Yusuf carried every lantern he had ever made and placed them along the coastline. When he lit them, a breathtaking path of soft blues, greens, and golden lights stretched across the harbor like stars fallen into the water. One by one, the boats found their way back. The next morning, fishermen said the sea looked less frightening when Yusuf's lanterns guided them. Children visited his workshop to learn how light can be shaped from broken things. Yusuf taught them that courage is not only loud and heroic; sometimes it is a quiet light helping others return home safely. From that day, Blue Harbor became known as \"The Town of a Thousand Lanterns,\" a place where light was crafted not by machines, but by care, imagination, and shared hope.",
            "Mira lived in a village where rains decided everything. If rain arrived on time, crops grew and festivals filled the streets with music. If the clouds changed their mind, farmers spent months worrying. Mira loved the sound of rain more than anything in the world. While others hid indoors, she listened to every drop like a musician listens to instruments. Her dream was to compose a melody inspired by rain, a song that could remind people of hope even in difficult seasons. One summer, dark clouds disappeared for weeks, and everyone began to worry. The wells dried, the fields cracked, and Mira's father whispered that their crops might fail. At night, when the village couldn't sleep, Mira took out her small flute and began playing soft notes that sounded like falling rain. Her music echoed through courtyards and narrow paths. Children gathered near her window, listening quietly. The next evening, more people joined. Soon, villagers who had stopped speaking to each other because of stress now sat together in silence, sharing moments of peace. Mira's music did not bring rain immediately, but something beautiful changed: fear became patience. Finally, one early morning, clouds returned. As rain touched the earth, villagers said they heard a rhythm, almost as if the sky remembered Mira's song.",
            "Every city had libraries filled with famous novels, but Aanya discovered something unusual: a museum of unwritten books. It was hidden in a quiet lane, and most people walked past it without noticing the rusty blue gate. Curious, Aanya stepped inside. Instead of shelves, there were glowing clouds floating in a large hall. A gentle voice said, \"These are stories that were never written, though someone once dreamed them.\" Aanya touched one glowing cloud, and suddenly she saw a girl imagining a book about friendship but putting it aside because she feared nobody would read it. Another cloud showed a boy who drew maps of magical kingdoms yet never shared them. Aanya felt sad thinking of all the ideas that remained silent. The voice whispered, \"Stories grow when someone believes in them.\" Aanya left the museum with a new determination. She began writing her own story, a tale about courage hidden in ordinary days. At first, her words felt uncertain, but she continued, remembering the museum's message. She shared her story at school, and classmates loved it because it reminded them of their own dreams. Aanya returned to the lane many times, yet the museum never appeared again. Still, she smiled, knowing its message lived inside her: Talent grows when we dare to use it.",
            "Books are a treasure of knowledge and imagination. They educate, entertain, and encourage readers to think deeply about life. Reading improves language skills, memory, and concentration. It introduces new ideas, cultures, and experiences. Many people find comfort and inspiration in books during difficult times. Storybooks allow readers to travel to different worlds, meet interesting characters, and explore exciting adventures without leaving their homes. Knowledge-based books teach subjects such as science, history, economics, and technology, helping students and professionals in their fields. Libraries and e-books make reading accessible to everyone. They provide a peaceful environment for learning and research. Parents should develop reading habits in children from a young age because strong reading ability builds confidence and creativity. Instead of spending too much time on mobile games or television, reading for even thirty minutes a day can improve thinking and communication skills. Book clubs and reading groups help people share ideas and understand different perspectives. Authors also play a special role by using their words to inform and inspire society. Writing a book requires patience, research, and imagination. Great books leave a lasting impact on readers and shape generations. Reading is not just a hobby, it is a lifelong companion that guides, supports, and transforms lives.",
            "Time is one of the most valuable resources in life. Unlike money and material possessions, once time is gone, it can never be brought back. People who understand the importance of time use it wisely to achieve their goals. Planning daily activities helps in reducing confusion and increasing productivity. Students should create a study schedule that includes breaks, revision, and practice. Professionals can divide tasks into priorities and complete them step by step. Time management also helps in maintaining balance between personal and professional life. Social media, unnecessary arguments, and procrastination waste precious hours that could be used for learning or improving skills. Waking up early gives more time to focus on important tasks and reduces stress. People who respect time are more likely to succeed in education, career, and relationships. Time also teaches valuable lessons. It shows that situations change, difficult moments pass, and new opportunities appear. Therefore, patience and hard work are essential. Respecting others' time is also a sign of good manners. Being punctual shows responsibility and builds trust. Life becomes meaningful when people invest time in health, family, creativity, and community service. Time is like a flowing river, and the best way to live is to make every moment count.",
            "Nature is a beautiful gift that supports life on Earth. The air we breathe, the water we drink, and the food we eat come directly from natural resources. Forests provide shelter to countless animals and help maintain environmental balance. Rivers and oceans regulate the climate and support agriculture, trade, and transportation. However, increasing pollution and careless human activities are harming nature. Plastic waste, deforestation, and chemical emissions are destroying ecosystems. Climate change has resulted in rising temperatures, melting glaciers, and unpredictable weather conditions. To protect nature, everyone must act responsibly. Planting more trees, saving water, using eco-friendly products, and reducing waste are simple steps that make a big difference. Governments and organizations are promoting renewable energy sources such as solar and wind power to reduce dependence on fossil fuels. Schools can teach students about conservation, recycling, and sustainable living. Communities can organize cleaning drives and awareness campaigns to protect forests, rivers, and wildlife. Nature also has the power to heal the human mind. Spending time in fresh air, listening to birds, and watching the sky reduce stress and improve overall well-being. When people respect nature, they ensure a safer future for the next generation. Protecting nature is not just a responsibility, it is a moral duty for everyone.",
            "Health is the greatest wealth a person can have in life. A strong mind lives in a healthy body, and therefore it is important to take proper care of both. People often ignore their health due to busy schedules, stress, and unhealthy lifestyle choices. Eating fresh and nutritious food keeps the body energetic and reduces the risk of diseases. Drinking enough water and getting sound sleep also support good health. Exercise strengthens muscles, improves digestion, and keeps the heart active. Even a simple habit like walking for thirty minutes every day can make a big difference. Mental health is equally important, and it requires peace, positive relationships, and meaningful goals. Talking to family and friends, practicing meditation, or spending time with nature helps reduce tension. Visiting doctors for regular check-ups ensures early diagnosis and better treatment. A healthy person can work more efficiently, enjoy quality time with loved ones, and contribute to society. Schools and workplaces should create awareness about healthy habits and encourage fitness activities. Social media and advertisements sometimes promote unrealistic body images, but true fitness is not about looking perfect, it is about feeling strong and confident. When people value health, they live a happier and more productive life.",
            "Ishaan loved computers, but he also loved nature. While other students played games, he spent hours learning programming and reading about forests. His village once had many trees, but most were cut down for construction. Summers grew hotter each year, and even the birds left. One evening, as Ishaan walked home from school, he wondered if technology could help restore the greenery. He created a simple app that counted how many trees a community planted, showing progress through colorful charts. Ishaan shared the idea with his teacher, who encouraged him to present it during the school's environment week. At first, students laughed and said, \"How can a student change the climate?\" But Ishaan calmly explained that big changes begin with small steps and strong ideas. Soon, teachers and families began using the app. People planted saplings outside schools, farms, and bus stops. The village council became interested and supported Ishaan's project. Within a year, more than eight hundred trees were planted, and birds slowly returned. News reporters visited the village to feature his work. Ishaan realized that knowledge becomes powerful when it helps others. He kept improving the app and dreamed of expanding it nationwide. His village taught the world that when technology and nature work together, the future grows greener for everyone.",
            "Karan was a taxi driver who worked in a busy city. He wanted to give safe and fast service to his passengers. Earlier, he used to ask people for directions when traveling to new places. Sometimes he made mistakes and wasted time. One day, a passenger told him about a navigation app. Karan downloaded the app and learned to use it. The app showed traffic, shortest routes, and time needed to reach each location. Karan followed the map and reached places faster. Passengers were happy with his service and recommended him to others. Karan cleaned his taxi daily and kept drinking water for passengers. He also played soft music so people could travel comfortably. His earnings increased slowly, and he saved money for his children's education. Karan believed that technology and good behavior could help people grow. He encouraged other taxi drivers to use navigation apps as well. They discussed safe driving and helping passengers with respect. Karan understood that learning new skills makes work easier. His story teaches us that small steps toward improvement can change a person's life. When technology is used in positive ways, it helps workers serve better and build trust. Karan continued driving with confidence and kindness.",
            "Sita was a school teacher who enjoyed helping her students learn new things. She wanted her classroom to be a place where children felt excited about education. Sita used simple teaching methods and explained lessons with real examples. One day, she learned about digital learning tools that could make study more interesting. She started using short animated videos to explain science and history. Students paid more attention and asked more questions. Sita encouraged them to explore ideas and think independently. She also organized small group activities where students worked together and shared knowledge. Parents noticed that their children were becoming more confident. Sita believed that teaching was not only about giving answers but also about guiding students to find answers themselves. When schools started online classes, she learned how to use video meetings and shared worksheets through mobile phones. It was challenging at first, but she continued practicing until she became comfortable. She discovered that technology could connect students to global knowledge. Sita inspired other teachers to try new methods. Her story shows that learning is not just for students. Teachers also need to improve skills and use new tools. Education becomes stronger when everyone learns together and supports each other.",
            "Arjun was a shopkeeper who sold groceries in a small market. He worked hard every day, but he wanted to grow his business. One afternoon, a customer asked if he accepted digital payments. Arjun did not know how these apps worked, but he became curious. His friend showed him how to install a payment app and how to receive money safely. Arjun practiced using the app and soon felt comfortable with it. Customers were happy because they did not always have to carry cash. Arjun noticed that more people started visiting his shop. He arranged products neatly and wrote clear labels so customers could find items easily. He also used a small mobile speaker to tell offers and discounts. His income improved slowly, and he used the extra money to bring more products to the shop. Arjun learned that good service and modern tools could help small businesses grow. He shared his experience with other shopkeepers in the market. They discussed new ideas and learned together. Arjun's family felt proud of him because he changed his business with learning and patience. His story teaches us that technology is useful even for small shops. Anyone who works hard and learns new skills can improve their life and serve people better.",
            "Meena was a hardworking farmer who lived in a small village near green fields. She loved her land and wanted to improve her farming methods. Earlier, she depended only on traditional advice, but one day her son showed her a weather app on his phone. The app told farmers about rain, wind, and temperature changes. Meena started checking the app before working in the field. This helped her decide the best day to plant seeds. She used good quality seeds and natural fertilizers to make the soil healthy. Slowly, she saw better growth in her crops. People in the village were surprised because her harvest was improving each season. Meena also learned about market prices using her phone. She sold her vegetables at the best rate and earned more money for her family. Her daughter helped her record expenses and profits in a simple mobile notebook app. Meena understood that technology was not only for cities; even farmers could use it to make work easier. She shared her knowledge with other women farmers and encouraged them to learn. Her journey taught everyone that learning new skills helps families grow. Meena proved that small ideas can bring big changes in life. Her story shows that technology can support traditional farming in a meaningful way.",
            "Rohan was a young student who lived in a small town and wanted to improve his future. He was good at reading books, but he knew that modern life required new skills. One day, his teacher told the class that technology could help students learn faster. Rohan started using online lessons on his phone. He watched videos, took notes, and read articles about different subjects. At first, it was difficult for him to understand everything, but he did not give up. He learned that progress takes time and that every small step brings a person closer to success. His parents supported him and encouraged him to keep learning. Rohan also practiced typing every day because he wanted a job in an office. He knew that companies needed people who could type fast and write clearly. Sometimes he made mistakes, but he learned from them and improved slowly. With regular study and practice, he became more confident. His teacher noticed his improvement and appreciated his hard work. Rohan understood that education was not only about memorizing answers but also about learning useful skills. He realized that knowledge becomes powerful when it is used in real life. His story reminds us that learning every day can change the future in a positive way.",
            "Healthy food gives energy to the body. It protects from diseases. It helps the mind stay active. Fruits and vegetables are full of vitamins. Grains give strength. Milk builds bones. Clean water keeps the body fresh. Junk food tastes good but harms health. Too much sugar causes problems. Oily food increases fat. Soft drinks are not healthy. People should choose healthy meals. Children need good food to grow. Students study better with a strong mind. Workers perform well with a healthy body. Families should cook balanced meals. Eating at the right time is important. Skipping breakfast is not good. Fresh home food is better than fast food. Exercise supports healthy food. Sleep completes body repair. Farmers play an important role. They grow food for everyone. Markets should keep clean food. Governments should check food quality. Schools should teach nutrition. Hospitals should guide patients about diet. Healthy food improves mood. It reduces stress. It increases lifespan. It supports strong immunity. When people eat healthy food, they feel confident. They enjoy life. They work better. They learn better. They live better. Healthy eating is not costly. It only needs planning. Eating simple food is a smart choice. Good food habits create a healthy nation for a stronger future.",
            "Every night, a strange train passed through Riverstone Station, though no one ever saw its passengers. It was said the train only carried dreams people abandoned—dreams that still wanted a chance to live. The station master, Mr. Dev, never believed the stories until he met a boy named Arin, who waited on the platform holding a dusty sketchbook. \"I used to draw buildings,\" Arin whispered, \"but everyone said architects need money, talent, and luck. I stopped trying.\" Mr. Dev noticed the approaching train, glowing like silver mist. Instead of wheels, it glided above the tracks. The doors opened, and Arin's sketches lifted into the air, forming bridges, libraries, and parks. A gentle voice spoke, \"Dreams fade when ignored, but they never stop waiting.\" Arin felt a spark he thought he had lost. He grabbed his sketchbook and promised himself he would learn, practice, and design something meaningful one day. Years later, Arin became an architect who created schools and hospitals in rural areas. When asked where his journey began, he always said, \"On a platform where my dream returned to me.\" The people of Riverstone Station still speak about the mysterious train and its message: \"Tomorrow belongs to those who refuse to give up.\""
        ];

        let targetWords = [];
        let timerInterval = null;
        let timeElapsed = 0;
        let timeLimit = 0;
        let isTestRunning = false;
        let totalKeystrokes = 0;
        let backspaceCount = 0;
        let previousInputValue = "";

        const passageSelect = document.getElementById("passage-select");
        const examSelect = document.getElementById("exam-select");
        const timerSelect = document.getElementById("timer-select");
        const fontSelect = document.getElementById("font-select");
        const backspaceSelect = document.getElementById("backspace-select");
        const themeSelect = document.getElementById("theme-select");
        
        const startBtn = document.getElementById("start-btn");
        const textContainer = document.getElementById("text-container");
        const hiddenInput = document.getElementById("hidden-input");
        const typeDisplay = document.getElementById("type-display");
        
        const statTime = document.getElementById("stat-time");
        const statKeystrokes = document.getElementById("stat-keystrokes");
        const statBackspace = document.getElementById("stat-backspace");
        const statKpm = document.getElementById("stat-kpm");
        const statWpm = document.getElementById("stat-wpm");
        const statRight = document.getElementById("stat-right");
        const statWrong = document.getElementById("stat-wrong");
        const statAccuracy = document.getElementById("stat-accuracy");

        window.onload = () => {
            loadPassage();
            changeFontSize();
            toggleTheme();
        };

        typeDisplay.addEventListener("click", () => {
            if (isTestRunning) hiddenInput.focus();
        });

        // मॅन्युअल स्थिर स्क्रोलिंग आणि हायलाइटिंग फंक्शन
        function updateParagraph(currentWordIndex) {
            textContainer.innerHTML = "";
            const rawTyped = hiddenInput.value;
            const typedWords = rawTyped.split(" ");

            targetWords.forEach((word, index) => {
                const wordSpan = document.createElement("span");
                wordSpan.id = `word-${index}`;
                wordSpan.className = "passage-word";

                // टायपिंग पूर्ण झालेल्या शब्दांसाठी बरोबर/चुकीचे तपासणे
                if (index < currentWordIndex) {
                    let typed = typedWords[index] || "";
                    if (typed === word) {
                        wordSpan.classList.add("passage-correct");
                    } else {
                        wordSpan.classList.add("passage-incorrect");
                    }
                } else if (index === currentWordIndex) {
                    // सध्या टायपिंग सुरू असलेला शब्द हायलाईट करणे
                    wordSpan.classList.add("current-word");
                }

                wordSpan.innerText = word;
                textContainer.appendChild(wordSpan);
                
                // शब्दांच्या मध्ये स्पेस जोडणे
                if (index < targetWords.length - 1) {
                    textContainer.appendChild(document.createTextNode(" "));
                }
            });

            // स्थिर स्क्रोलिंग पद्धत (वेब पेज न हलवता केवळ बॉक्स स्क्रोल करणे)
            const allWordSpans = textContainer.querySelectorAll('.passage-word');
            if (allWordSpans[currentWordIndex]) {
                const activeWord = allWordSpans[currentWordIndex];
                const parent = textContainer;
                const targetScrollTop = activeWord.offsetTop - (parent.clientHeight / 2) + (activeWord.clientHeight / 2);
                parent.scrollTo({
                    top: targetScrollTop,
                    behavior: 'smooth'
                });
            }
        }

        function loadPassage() {
            const index = passageSelect.value;
            const fullText = passages[index] || passages[0];
            
            targetWords = fullText.trim().split(/\s+/);
            
            updateParagraph(0);
            resetTest();
        }

        function toggleExamMode() {
            if (examSelect.value === "On") {
                document.body.classList.add("exam-mode-active");
            } else {
                document.body.classList.remove("exam-mode-active");
            }
        }

        function changeFontSize() {
            const size = fontSelect.value;
            textContainer.style.fontSize = size;
            typeDisplay.style.fontSize = size;
            hiddenInput.style.fontSize = size;
        }

        function toggleTheme() {
            if (themeSelect.value === "Dark") {
                document.body.setAttribute("data-theme", "dark");
            } else {
                document.body.removeAttribute("data-theme");
            }
        }

        function startTest() {
            if (isTestRunning) return;

            let selectedTime = timerSelect.value;
            timeLimit = selectedTime === "No Time" ? 0 : parseInt(selectedTime);

            isTestRunning = true;
            hiddenInput.disabled = false;
            
            // टेस्ट सुरू झाल्यावर टच इव्हेंट चालू करणे जेणेकरून टायपिंग नीट फोकस होईल
            hiddenInput.style.pointerEvents = "auto";
            hiddenInput.focus();
            
            startBtn.disabled = true;
            passageSelect.disabled = true;
            timerSelect.disabled = true;
            
            timeElapsed = 0;
            previousInputValue = "";
            hiddenInput.value = "";
            
            updateTimerDisplay();
            processTyping();

            timerInterval = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();
                calculateStats();
                
                if (timeLimit > 0 && timeElapsed >= timeLimit) {
                    endTest();
                }
            }, 1000);
        }

        function endTest() {
            clearInterval(timerInterval);
            isTestRunning = false;
            hiddenInput.disabled = true;
            
            // टेस्ट संपल्यावर टच इव्हेंट बंद करणे जेणेकरून युझर थेट खालच्या आऊटपुट बॉक्समधील स्क्रोल बार ओढून चुका पाहू शकतील
            hiddenInput.style.pointerEvents = "none";
            
            startBtn.disabled = false;
            passageSelect.disabled = false;
            timerSelect.disabled = false;
            calculateStats();
            
            // सर्व टाईप झालेल्या शब्दांचे पुनरावलोकन (Review) वरच्या बॉक्समध्ये दाखवणे
            const rawTyped = hiddenInput.value;
            const typedWords = rawTyped.split(" ");
            updateParagraph(typedWords.length);
        }

        function resetTest() {
            clearInterval(timerInterval);
            isTestRunning = false;
            timeElapsed = 0;
            totalKeystrokes = 0;
            backspaceCount = 0;
            previousInputValue = "";

            hiddenInput.value = "";
            hiddenInput.disabled = true;
            
            // रिसेट केल्यावर टच इव्हेंट बंद ठेवणे
            hiddenInput.style.pointerEvents = "none";
            
            typeDisplay.innerHTML = `<span style="color: #888;">Start typing here...</span>`;
            
            startBtn.disabled = false;
            passageSelect.disabled = false;
            timerSelect.disabled = false;

            let selectedTime = timerSelect.value;
            timeLimit = selectedTime === "No Time" ? 0 : parseInt(selectedTime);
            updateTimerDisplay();

            const spans = textContainer.querySelectorAll(".passage-word");
            spans.forEach(span => {
                span.className = "passage-word";
            });
            
            statKeystrokes.innerText = "0";
            statBackspace.innerText = "0";
            statKpm.innerText = "0";
            statWpm.innerText = "0";
            statRight.innerText = "0";
            statWrong.innerText = "0";
            statAccuracy.innerText = "0%";
            
            textContainer.scrollTop = 0;
            typeDisplay.scrollTop = 0;
        }

        function updateTimerDisplay() {
            let displayTime = timeLimit > 0 ? timeLimit - timeElapsed : timeElapsed;
            let minutes = Math.floor(displayTime / 60);
            let seconds = displayTime % 60;
            statTime.innerText = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        }

        hiddenInput.addEventListener("keydown", (e) => {
            if (!isTestRunning) return;
            
            if (e.key === "Backspace") {
                if (backspaceSelect.value === "Off") {
                    e.preventDefault();
                    return;
                }
                backspaceCount++;
                statBackspace.innerText = backspaceCount;
            } else if (e.key.length === 1) {
                totalKeystrokes++;
                statKeystrokes.innerText = totalKeystrokes;
            }
        });

        // टायपिंग करताना आणि टेस्ट सुरू असताना दोन्ही टायपिंग बॉक्सचे स्क्रोलिंग एकमेकांसोबत सिंक्रोनाइझ (Sync) करणे
        hiddenInput.addEventListener("scroll", () => {
            typeDisplay.scrollTop = hiddenInput.scrollTop;
        });

        // १. कर्सर मागे-पुढे हलवल्यानंतर आणि क्लिक, टच किंवा माऊस सोडल्यानंतर नवीन कर्सर पोझिशन अचूक मिळवणे
        hiddenInput.addEventListener("click", () => {
            if (isTestRunning) processTyping();
        });

        hiddenInput.addEventListener("mouseup", () => {
            if (isTestRunning) processTyping();
        });

        hiddenInput.addEventListener("touchend", () => {
            if (isTestRunning) {
                // लहानसा डिले दिला आहे जेणेकरून सिलेक्शन नवीन जागी पोहोचेल
                setTimeout(processTyping, 40);
            }
        });

        hiddenInput.addEventListener("keyup", (e) => {
            if (!isTestRunning) return;
            if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
                processTyping();
            }
        });

        hiddenInput.addEventListener("input", (e) => {
            if (!isTestRunning) return;

            if (backspaceSelect.value === "Off" && hiddenInput.value.length < previousInputValue.length) {
                hiddenInput.value = previousInputValue;
                return;
            }

            previousInputValue = hiddenInput.value;
            processTyping();
        });

        // २. कर्सर अलाईनमेंट (Pixel-Perfect Alignment) राखण्यासाठी सुधारित टायपिंग डिस्प्ले प्रक्रिया
        function processTyping() {
            const rawTyped = hiddenInput.value;
            const caretPos = hiddenInput.selectionStart;

            // अक्षरांचे अंतर बिघडू नये म्हणून स्पेस आणि कॅरेक्टर्सचे भाग योग्य पद्धतीने विभागले आहेत
            const part1 = rawTyped.substring(0, caretPos);
            const part2 = rawTyped.substring(caretPos);

            const escapeHtml = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            // कर्सर प्रत्यक्ष रेंडर होत असताना देखील फॉन्ट आणि अलाईनमेंट एकसमान राहते
            typeDisplay.innerHTML = `<span>${escapeHtml(part1)}</span><span class="cursor"></span><span>${escapeHtml(part2)}</span>`;

            // सक्रिय शब्दाचा इंडेक्स मिळवणे
            const textBeforeCaret = rawTyped.substring(0, caretPos);
            const typedWords = rawTyped.split(" ");
            const currentWordIndex = textBeforeCaret.split(" ").length - 1;

            // हिरवे आणि लाल रंगाचे सर्व हायलाईट्स केवळ वरच्या पॅसेजमध्ये दाखवणे
            updateParagraph(currentWordIndex);

            // आऊटपुट टायपिंग बॉक्स स्क्रोल करणे
            const cursorEl = typeDisplay.querySelector('.cursor');
            if (cursorEl) {
                const bottomPos = cursorEl.offsetTop - typeDisplay.offsetTop;
                if (bottomPos > typeDisplay.scrollTop + typeDisplay.clientHeight - 40 || bottomPos < typeDisplay.scrollTop) {
                    typeDisplay.scrollTop = bottomPos - (typeDisplay.clientHeight / 2);
                }
            }

            // अदृश्य इनपुटचे स्क्रोलिंग प्रत्यक्ष टायपिंग बॉक्सशी पूर्णपणे सिंक करणे
            hiddenInput.scrollTop = typeDisplay.scrollTop;

            calculateStats();

            if (currentWordIndex >= targetWords.length) {
                endTest();
            }
        }

        function calculateStats() {
            const rawTyped = hiddenInput.value;
            const typedWords = rawTyped.split(" ");
            
            let correctChars = 0;
            let rightWords = 0;
            let wrongWords = 0;

            for (let i = 0; i < typedWords.length; i++) {
                let typed = typedWords[i];
                let target = targetWords[i] || "";
                
                if (i < typedWords.length - 1) { 
                    if (typed === target) {
                        rightWords++;
                        correctChars += target.length + 1; 
                    } else {
                        wrongWords++;
                    }
                } else { 
                    for(let j=0; j < Math.min(typed.length, target.length); j++) {
                        if (typed[j] === target[j]) correctChars++;
                    }
                }
            }

            let minutes = timeElapsed / 60;
            let wpm = 0;
            let kpm = 0;

            if (minutes > 0) {
                wpm = Math.round((correctChars / 5) / minutes);
                kpm = Math.round(totalKeystrokes / minutes);
            }

            let accuracy = 0;
            if (rawTyped.length > 0) {
                accuracy = Math.round((correctChars / rawTyped.length) * 100);
                if(accuracy > 100) accuracy = 100;
            }

            statKpm.innerText = kpm;
            statWpm.innerText = wpm;
            statRight.innerText = rightWords;
            statWrong.innerText = wrongWords;
            statAccuracy.innerText = accuracy + "%";
        }
    </script>
